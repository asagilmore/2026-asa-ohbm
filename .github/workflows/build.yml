name: Build LaTeX Poster

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-bibtex-extra texlive-fonts-recommended texlive-fonts-extra

      - name: Build PDF
        run: make

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: poster
          path: poster.pdf